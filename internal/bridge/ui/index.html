<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentRelay</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --line:#e4e7eb; --line-2:#c8d0d8;
  --ink:#151a20; --muted:#69727d; --faint:#98a1ab;
  --online:#0f7a55; --offline:#9a6700; --danger:#ae2a31;
  --sans:"Segoe UI",system-ui,"Microsoft YaHei UI","PingFang SC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans)}
header,main,#message{max-width:820px;margin-inline:auto;padding-inline:24px}
header{display:flex;align-items:center;gap:10px;padding-block:18px 0}
h1{margin:0;font-size:15px;font-weight:600}
h2{margin:0;padding:18px 0 7px;font-size:12.5px;font-weight:500;color:var(--muted)}
h2 em{font-style:normal;color:var(--faint)}
#message{margin-top:7px;font-size:12px;color:var(--danger)}
#message:empty{display:none}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line);padding:12px 0}
.grow{flex:1}
.empty{color:var(--faint);font-size:12.5px;padding:11px 0}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.dot.on{background:var(--online)}
.dot.off{background:var(--offline)}
.name{font-size:13.5px;font-weight:600}
.state{font-size:11.5px;color:var(--muted)}
code,.code{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body,.meta{display:flex;align-items:baseline;gap:14px;margin-top:5px;min-width:0;flex-wrap:wrap}
.code{font-size:25px;font-weight:600;letter-spacing:.05em;color:var(--ink);line-height:1.15}
.fields{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:8px 16px;margin-top:10px}
.f{display:flex;align-items:center;gap:8px;min-width:0}
.f>label{flex:none;font-size:11.5px;color:var(--muted)}
.f>select{width:auto;min-width:132px}
.f.wide{grid-column:1/-1;align-items:flex-start}
.f.wide>label{padding-top:8px}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:4px 11px;cursor:pointer}
button:hover{border-color:#aab3bd}
button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:#2a323b;border-color:#2a323b}
button.quiet{border-color:transparent;background:none;color:#525b66;padding:4px 7px}
button.quiet:hover{background:#e9ecf0;color:var(--ink)}
button.quiet.danger{color:var(--danger)}
button.quiet.danger:hover{background:#fbeeef}
button[disabled]{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:4px 8px;width:100%}
textarea{font-family:var(--mono);font-size:11.5px;line-height:1.5;resize:vertical;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#8d97a2;box-shadow:0 0 0 3px #e7eaee}
@media(max-width:560px){
  .fields{grid-template-columns:1fr}
  header,main,#message{padding-inline:16px}
}
</style>
</head>
<body>
<header><h1>AgentRelay</h1><span class="grow"></span><button class="quiet" onclick="refresh(true)">刷新</button></header>
<p id="message" role="status"></p>
<main>
  <section id="pairings-section" hidden>
    <h2>待处理配对 <em id="pairings-count"></em></h2>
    <ul id="pairings"></ul>
  </section>
  <section>
    <h2>设备 <em id="devices-count"></em></h2>
    <ul id="devices"></ul>
  </section>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const api = (path, opt = {}) => fetch(path, {headers: {'Content-Type': 'application/json'}, ...opt})
  .then(async r => { const t = await r.text(); if (!r.ok) throw Error(t || r.statusText); return t ? JSON.parse(t) : null; });
const say = m => { $('#message').textContent = m || ''; };
const busy = (el, on) => el.querySelectorAll('button').forEach(b => b.disabled = on);

let devices = [];

function editing() {
  const a = document.activeElement;
  return !!a && a.closest('#devices') && a.matches('input,select,textarea');
}

async function refresh(force) {
  if (!force && editing()) return;
  try {
    const [ds, ps] = await Promise.all([api('/v1/devices'), api('/v1/pair-requests')]);
    devices = ds || [];
    renderPairs(ps || []);
    renderDevices();
    say('');
  } catch (e) { say(e.message); }
}

function renderPairs(ps) {
  const section = $('#pairings-section');
  section.hidden = !ps.length;
  $('#pairings-count').textContent = ps.length || '';
  $('#pairings').innerHTML = ps.map(p => `<li>
    <div class="head">
      <span class="name">${esc(p.device.name)}</span>
      <span class="grow"></span>
      <button class="quiet danger" onclick="decide(this,'${esc(p.id)}',false)">拒绝</button>
      <button class="primary" onclick="decide(this,'${esc(p.id)}',true)">批准</button>
    </div>
    <div class="body">
      <span class="code">${esc(p.verification)}</span>
      <code>${esc(p.device.workspace)}</code>
    </div>
  </li>`).join('');
}

function renderDevices() {
  const el = $('#devices');
  $('#devices-count').textContent = devices.length ? String(devices.length) : '';
  if (!devices.length) {
    el.innerHTML = '<li class="empty">暂无设备，在被控端运行 AgentRelay worker setup 发起配对</li>';
    return;
  }
  const sorted = [...devices].sort((a, b) => (a.name || '').localeCompare(b.name || '') || (a.id || '').localeCompare(b.id || ''));
  el.innerHTML = sorted.map(device).join('');
}

function device(d) {
  const id = esc(d.id);
  const desktop = d.desktop_access === 'revoked' ? 'revoked' : 'granted';
  const mappings = Object.entries(d.workspace_mappings || {}).map(([local, remote]) => local + '=' + remote).join('\n');
  return `<li data-id="${id}">
    <div class="head">
      <span class="dot ${d.online ? 'on' : 'off'}"></span>
      <span class="name">${esc(d.name)}</span>
      <span class="state">${d.online ? '在线' : '离线'}</span>
      <span class="grow"></span>
      <button class="primary" onclick="save(this,'${id}')">保存</button>
      <button class="quiet" onclick="toggle(this,'${id}',${!d.authorized})">${d.authorized ? '撤销授权' : '恢复授权'}</button>
      <button class="quiet danger" onclick="remove(this,'${id}')">移除</button>
    </div>
    <div class="meta">${d.handle ? `<code>${esc(d.handle)}</code>` : ''}<code>${esc(d.workspace)}</code></div>
    <div class="fields">
      <div class="f"><label for="n-${id}">别名</label><input id="n-${id}" data-field="name" value="${esc(d.name)}"></div>
      <div class="f"><label for="d-${id}">桌面</label><select id="d-${id}" data-field="desktop_access">
        <option value="granted"${desktop === 'granted' ? ' selected' : ''}>允许</option>
        <option value="revoked"${desktop === 'revoked' ? ' selected' : ''}>禁止</option>
      </select></div>
      <div class="f wide"><label for="m-${id}">映射</label><textarea id="m-${id}" data-field="workspace_mappings" rows="1" spellcheck="false" placeholder="本地路径=远端路径">${esc(mappings)}</textarea></div>
    </div>
  </li>`;
}

function parseMap(text) {
  const out = {};
  for (const line of text.split(/\r?\n/)) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const i = trimmed.indexOf('=');
    if (i < 1) throw Error('映射格式：本地路径=远端路径');
    out[trimmed.slice(0, i).trim()] = trimmed.slice(i + 1).trim();
  }
  return out;
}

async function decide(btn, id, approve) {
  busy(btn.closest('li'), true);
  try { await api('/v1/pair-requests/' + encodeURIComponent(id) + '/' + (approve ? 'approve' : 'reject'), {method: 'POST'}); await refresh(true); }
  catch (e) { say(e.message); busy(btn.closest('li'), false); }
}

async function save(btn, id) {
  const li = btn.closest('li');
  busy(li, true);
  try {
    await api('/v1/devices/' + encodeURIComponent(id), {method: 'PATCH', body: JSON.stringify({
      name: li.querySelector('[data-field=name]').value,
      desktop_access: li.querySelector('[data-field=desktop_access]').value,
      workspace_mappings: parseMap(li.querySelector('[data-field=workspace_mappings]').value)
    })});
    await refresh(true);
  } catch (e) { say(e.message); busy(li, false); }
}

async function toggle(btn, id, authorized) {
  busy(btn.closest('li'), true);
  try { await api('/v1/devices/' + encodeURIComponent(id), {method: 'PATCH', body: JSON.stringify({authorized})}); await refresh(true); }
  catch (e) { say(e.message); busy(btn.closest('li'), false); }
}

async function remove(btn, id) {
  if (!confirm('移除后需要重新配对，确定继续？')) return;
  busy(btn.closest('li'), true);
  try { await api('/v1/devices/' + encodeURIComponent(id), {method: 'DELETE'}); await refresh(true); }
  catch (e) { say(e.message); busy(btn.closest('li'), false); }
}

refresh(true);
setInterval(() => refresh(false), 5000);
</script>
</body>
</html>
