name: Verify
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - name: Build runtime-free binaries
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/...
      - name: Check lightweight Worker dependency boundary
        shell: bash
        run: |
          go list -deps ./cmd/AgentRelay-worker > worker-deps.txt
          if grep -E '^AgentRelay/internal/(controller|backend|connection|filesync)$' worker-deps.txt; then exit 1; fi
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh scripts/build.sh
